name: Build APK

on:
  push:
    branches: [ main, voice ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Skazhy-${{ github.ref_name == 'voice' && 'voice-' || '' }}v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skazhy-apk
          path: Skazhy-${{ github.ref_name == 'voice' && 'voice-' || '' }}v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'voice' && 'voice-' || 'build-' }}${{ github.run_number }}
          name: Скажи – збірка ${{ github.run_number }}${{ github.ref_name == 'voice' && ' (записаний голос)' || '' }}
          body: "APK для встановлення на Android (сторонні джерела). Завантажте файл нижче."
          files: Skazhy-${{ github.ref_name == 'voice' && 'voice-' || '' }}v${{ github.run_number }}.apk
